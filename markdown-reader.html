<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Paste or drop a Markdown file to read it rendered, wrapped to a comfortable line length, with adjustable font, size, and width." />
<title>Markdown Reader</title>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>

<style>
  :root {
    --bg: #fefefe;
    --ink: #111317;
    --ink-dim: #5a5e64;
    --rule: #dadce0;
    --soft: #f3f4f5;
    --badge: #eeeff1;
    --dash: #b9bdc3;
    --key-face: #fafafa;
    --key-hover: #f0f0f0;
    --key-ink: #1a1a1a;
    --key-edge: #111;
    --key-base: #333;
    --sel-bg: #1a1a1a;
    --sel-ink: #fff;
    --danger: #c62828;
    --danger-bg: #fdf1f1;
    --dis-ink: #a3a6ab;
    --dis-edge: #c8cbcf;
    --dis-base: #d5d8dc;
    --selection: #e2e2e2;
    color-scheme: light;
    --ui: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --serif: Charter, "Bitstream Charter", "Iowan Old Style", "Sitka Text", Cambria, Georgia, serif;
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --read-font: var(--sans);
    --read-size: 19px;
    --measure: 68ch;
  }
  :root[data-theme="dark"] {
    --bg: #17181b;
    --ink: #e4e5e7;
    --ink-dim: #9da1a7;
    --rule: #34363b;
    --soft: #212328;
    --badge: #2a2c31;
    --dash: #4a4d53;
    --key-face: #2b2d32;
    --key-hover: #34373d;
    --key-ink: #e4e5e7;
    --key-edge: #5a5d63;
    --key-base: #3e4147;
    --sel-bg: #e4e5e7;
    --sel-ink: #17181b;
    --danger: #ff8a80;
    --danger-bg: #3a2426;
    --dis-ink: #62666c;
    --dis-edge: #3a3c41;
    --dis-base: #2a2c30;
    --selection: #3d4047;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  button, input { font-family: inherit; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--ui); -webkit-font-smoothing: antialiased; min-height: 100vh; }

  /* ---- header ---- */
  .bar {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 14px 20px;
  }
  .bar.scrolled { box-shadow: 0 1px 0 var(--rule); }
  .key kbd { font-family: inherit; font-size: 11px; line-height: 1; color: var(--ink-dim); background: var(--badge); border-radius: 3px; padding: 3px 5px; margin-left: 2px; position: relative; top: 1px; }
  .key:disabled kbd { color: inherit; background: var(--soft); }
  .controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-left: auto; }

  /* segmented keycaps: joined keys; the selected one stays pressed */
  .seg { display: inline-flex; align-items: flex-start; margin-bottom: 5px; }
  .seg button {
    position: relative; top: 0; cursor: pointer; line-height: 1;
    font-size: 14px; color: var(--key-ink); background: var(--key-face);
    border: 1px solid var(--key-edge); border-bottom: none; border-right-width: 0; border-radius: 0;
    padding: 8px 13px 10px; height: 34px;
    box-shadow: 0 4px 0 var(--key-base), 0 5px 0 var(--key-edge); transition: box-shadow .06s, top .06s;
  }
  .seg button:first-child { border-radius: 4px 0 0 4px; }
  .seg button:last-child { border-radius: 0 4px 4px 0; border-right-width: 1px; }
  .seg button:hover { background: var(--key-hover); }
  .seg button:active { top: 4px; box-shadow: 0 1px 0 var(--key-edge); }
  .seg button[aria-pressed="true"],
  .seg button[aria-pressed="true"]:hover { background: var(--sel-bg); color: var(--sel-ink); }
  .seg button:focus-visible, .key:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .seg .serif { font-family: var(--serif); }
  .seg .mono { font-family: var(--mono); }

  .key {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer; position: relative; top: 0;
    font-size: 14px; line-height: 1; color: var(--key-ink); background: var(--key-face);
    border: 1px solid var(--key-edge); border-bottom: none; border-radius: 4px; padding: 8px 14px 10px;
    box-shadow: 0 4px 0 var(--key-base), 0 5px 0 var(--key-edge); transition: box-shadow .06s, top .06s; margin-bottom: 5px; height: 34px;
  }
  .key:hover { background: var(--key-hover); }
  .key:active { top: 4px; box-shadow: 0 1px 0 var(--key-edge); }
  .key svg { width: 16px; height: 16px; }
  .key.danger:hover { color: var(--danger); background: var(--danger-bg); }
  .key:disabled, .key:disabled:hover { cursor: default; color: var(--dis-ink); background: var(--key-face); border-color: var(--dis-edge); box-shadow: 0 4px 0 var(--dis-base), 0 5px 0 var(--dis-edge); top: 0; }
  .key.icon { padding: 8px 9px 10px; }

  /* ---- empty state ---- */
  .empty {
    max-width: 560px; margin: 14vh auto 0; padding: 56px 40px; text-align: center;
    border: 1px dashed var(--dash); border-radius: 4px;
  }
  .empty .big { display: block; font-size: 22px; margin-bottom: 8px; }
  .empty .small { font-size: 14px; color: var(--ink-dim); display: block; margin-bottom: 20px; }
  .empty kbd { border: 1px solid var(--rule); border-radius: 4px; padding: 1px 6px; font-size: 12px; background: var(--soft); font-family: var(--ui); }
  body.dragging .empty, body.dragging .doc { outline: 2px dashed var(--ink); outline-offset: 8px; }

  /* ---- reading column ---- */
  .doc {
    max-width: var(--measure); margin: 24px auto 120px; padding: 0 24px;
    font-family: var(--read-font); font-size: var(--read-size); line-height: 1.65;
    overflow-wrap: break-word; hyphens: auto; text-rendering: optimizeLegibility;
  }
  .doc > :first-child { margin-top: 0; }
  .doc p, .doc ul, .doc ol, .doc blockquote, .doc pre, .doc table, .doc .frontmatter { margin: 0 0 1.1em; }
  .doc h1, .doc h2, .doc h3, .doc h4, .doc h5, .doc h6 { line-height: 1.25; margin: 2em 0 0.6em; }
  .doc h1 { font-size: 2em; font-weight: 700; margin-top: 0.4em; letter-spacing: -0.01em; }
  .doc h2 { font-size: 1.45em; font-weight: 700; padding-top: 0.6em; border-top: 1px solid var(--rule); }
  .doc h3 { font-size: 1.2em; font-weight: 700; }
  .doc h4 { font-size: 1em; font-weight: 700; }
  .doc h5, .doc h6 { font-size: 0.85em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-dim); }
  .doc h1 + h2 { border-top: none; padding-top: 0; }
  .doc a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .doc a:hover { text-decoration-thickness: 2px; }
  .doc ul, .doc ol { padding-left: 1.4em; }
  .doc li { margin: 0.3em 0; }
  .doc li > ul, .doc li > ol { margin: 0.3em 0 0; }
  .doc li:has(> input[type="checkbox"]) { list-style: none; margin-left: -1.4em; }
  .doc input[type="checkbox"] { margin: 0 0.5em 0 0; transform: translateY(1px); }
  .doc blockquote { margin-left: 0; padding: 0.1em 0 0.1em 1.1em; border-left: 3px solid var(--rule); color: var(--ink-dim); }
  .doc blockquote > :last-child { margin-bottom: 0; }
  .doc hr { border: none; border-top: 1px solid var(--rule); margin: 2.4em 0; }
  .doc img { max-width: 100%; height: auto; }
  .doc code { font-family: var(--mono); font-size: 0.84em; background: var(--soft); border-radius: 3px; padding: 0.1em 0.3em; }
  .doc pre {
    font-family: var(--mono); font-size: 0.8em; line-height: 1.55; background: var(--soft);
    border-radius: 4px; padding: 1em 1.1em; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .doc pre code { background: none; padding: 0; font-size: 1em; }
  .doc table { border-collapse: collapse; font-size: 0.88em; display: block; overflow-x: auto; max-width: 100%; }
  .doc th, .doc td { border-bottom: 1px solid var(--rule); padding: 0.45em 0.9em 0.45em 0; text-align: left; vertical-align: top; }
  .doc th { font-weight: 700; border-bottom-color: var(--ink); }
  .doc .frontmatter { font-family: var(--mono); font-size: 0.75em; color: var(--ink-dim); border-left: 3px solid var(--rule); padding: 0.2em 0 0.2em 1em; white-space: pre-wrap; }

  /* ---- history rail ---- */
  :root { --rail-closed: 60px; --rail-open: 264px; --rail-w: var(--rail-closed); }
  body.side-open { --rail-w: var(--rail-open); }
  .side {
    position: fixed; left: 0; top: 0; bottom: 0; width: var(--rail-w); z-index: 11;
    background: var(--bg); border-right: 1px solid var(--rule);
    display: flex; flex-direction: column; transition: width .18s ease; overflow: hidden;
  }
  .side-top { display: flex; align-items: center; gap: 10px; padding: 14px 12px 6px; min-height: 64px; }
  .side-body { display: flex; flex-direction: column; flex: 1; min-height: 0; width: var(--rail-open); }
  body:not(.side-open) .side-body, body:not(.side-open) .side-top .side-label { display: none; }
  .side-label { display: flex; align-items: baseline; justify-content: space-between; flex: 1; padding-right: 4px; }
  .side-label h2 { font-size: 13px; font-weight: 500; margin: 0; color: var(--ink-dim); letter-spacing: 0.02em; }
  .side-label .count { font-size: 12px; color: var(--ink-dim); }
  .bar, main { margin-left: var(--rail-w); transition: margin-left .18s ease; }
  .title-wrap { flex: 1; min-width: 0; display: flex; }
  .filename {
    display: inline-flex; align-items: center; gap: 7px; max-width: 100%; min-width: 0;
    font-size: 14px; color: var(--ink); background: var(--badge); border-radius: 4px; padding: 6px 10px;
  }
  .filename svg { width: 14px; height: 14px; flex: 0 0 auto; color: var(--ink-dim); }
  .filename span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hist { list-style: none; margin: 0; padding: 4px 8px 0; overflow-y: auto; flex: 1; }
  .hist li { position: relative; }
  .hist .item {
    display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; cursor: pointer;
    background: none; border: none; border-radius: 4px; padding: 8px 30px 8px 8px; color: var(--ink);
  }
  .hist .item:hover { background: var(--soft); }
  .hist li.current .item { background: var(--badge); }
  .hist .item svg { width: 15px; height: 15px; flex: 0 0 auto; margin-top: 2px; color: var(--ink-dim); }
  .hist .txt { display: flex; flex-direction: column; min-width: 0; gap: 2px; }
  .hist .nm { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hist .meta { font-size: 12px; color: var(--ink-dim); }
  .hist .rm {
    position: absolute; right: 4px; top: 7px; border: none; background: none; color: var(--ink-dim);
    padding: 4px; border-radius: 4px; cursor: pointer; display: flex; opacity: 0;
  }
  .hist li:hover .rm, .hist .rm:focus-visible { opacity: 1; }
  .hist .rm:hover { color: var(--danger); background: var(--danger-bg); }
  .hist .rm svg { width: 13px; height: 13px; }
  .side-empty { font-size: 13px; color: var(--ink-dim); padding: 8px 16px; margin: 0; flex: 1; }
  .side-foot { padding: 10px 16px 14px; border-top: 1px solid var(--rule); }
  .linkbtn { background: none; border: none; padding: 0; font-size: 13px; color: var(--ink-dim); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .linkbtn:hover { color: var(--danger); }
  .linkbtn:disabled { opacity: .4; cursor: default; color: var(--ink-dim); }

  .hidden { display: none !important; }
  ::selection { background: var(--selection); }
  .doc img { background: #fff; }
  :root[data-theme="dark"] .theme-sun { display: inline; }
  :root[data-theme="dark"] .theme-moon, .theme-sun { display: none; }

  @media (max-width: 720px) {
    .bar { padding: 12px 16px; gap: 10px; }
    .key kbd { display: none; }
    .controls { margin-left: 0; width: 100%; gap: 10px; }
    .title-wrap { flex-basis: 100%; }
    .doc { padding: 0 16px; }
    :root { --rail-closed: 56px; }
    .bar, main { margin-left: var(--rail-closed); }
    body.side-open .side { width: min(86vw, var(--rail-open)); box-shadow: 0 0 0 100vmax rgba(0,0,0,.25); }
    .empty { margin: 8vh 16px 0; padding: 40px 20px; }
  }
</style>
<script>
  // set theme before first paint to avoid a flash
  (function () { var t = null; try { t = (JSON.parse(localStorage.getItem('markdown-reader.session.v1') || '{}') || {}).theme; } catch (e) {}
    if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t); })();
</script>
</head>
<body>
<header class="bar" id="bar">
  <div class="title-wrap"><span class="filename hidden" id="filename" title="">

    <span id="filenameText"></span>

  <div class="controls">

      <svg class="theme-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
    </button>
    <div class="seg" role="group" aria-label="Font">
      <button class="serif" data-font="serif" title="Serif">Serif</button>

      <button class="mono" data-font="mono" title="Monospace">Mono</button>

      <button data-size="1" title="Larger text">A+</button>

    <div class="seg" role="group" aria-label="Line width">

      <button data-width="68" title="Medium column">Medium</button>
      <button data-width="84" title="Wide column">Wide</button>
    </div>
    <button class="key" id="openBtn" title="Open a Markdown file">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
      Open <kbd class="sc" data-keys="O"></kbd>
    </button>
    <button class="key danger" id="clearBtn" title="Clear the current document" disabled>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      Clear <kbd class="sc" data-keys="⌫"></kbd>
    </button>
  </div>
</header>

<aside class="side" id="side" aria-label="History">
  <div class="side-top">
    <button class="key icon" id="sideBtn" title="Show history" aria-label="Toggle history" aria-expanded="false" aria-controls="side">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
    </button>
    <div class="side-label"><h2>History</h2><span class="count" id="histCount"></span></div>
  </div>
  <div class="side-body">
    <ul class="hist" id="hist"></ul>
    <p class="side-empty hidden" id="histEmpty">Files you open or paste will show up here.</p>
    <div class="side-foot"><button class="linkbtn" id="histClear">Clear history</button></div>
  </div>
</aside>

<main>
  <div class="empty" id="empty">
    <span class="big">Read a Markdown file</span>
    <span class="small">drag &amp; drop, open, or paste <kbd>Ctrl/Cmd</kbd>+<kbd>V</kbd></span>
    <button class="key" id="openBtn2">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
      Open file
    </button>
  </div>
  <article class="doc hidden" id="doc"></article>
</main>
<input type="file" id="fileInput" accept=".md,.markdown,.mdx,.txt,text/markdown,text/plain" class="hidden" />

<script>
(function () {

  var state = { theme: null, font: 'sans', size: 19, width: 68, text: '', name: '', currentId: null, side: null };
  var HKEY = 'markdown-reader.history.v1', HMAX = 25;

  var ICON_FILE = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';

  var ICON_X = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>';

      b.addEventListener('click', function () {
        state.currentId = h.id; setDoc(h.text, h.name);
        if (window.innerWidth < 1000) setSide(false);
      });
      var rm = document.createElement('button'); rm.className = 'rm'; rm.title = 'Remove from history'; rm.innerHTML = ICON_X;
      rm.addEventListener('click', function () {
        history = history.filter(function (x) { return x.id !== h.id; }); saveHistory(); renderHistory();
      });
      li.appendChild(b); li.appendChild(rm); ul.appendChild(li);
    });
    $('histEmpty').classList.toggle('hidden', history.length > 0);
    ul.classList.toggle('hidden', !history.length);
    $('histCount').textContent = history.length ? history.length : '';
    $('histClear').disabled = !history.length;
  }
  function setSide(open) {
    state.side = open; save();
    document.body.classList.toggle('side-open', open);
    $('sideBtn').setAttribute('aria-expanded', open);
    $('sideBtn').title = open ? 'Hide history' : 'Show history';
  }

  function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
  function load() {
    try { var d = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); if (d) Object.keys(state).forEach(function (k) { if (d[k] != null) state[k] = d[k]; }); } catch (e) {}
  }

  function currentTheme() {
    if (state.theme) return state.theme;
    return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function applyTheme() {
    var t = currentTheme();
    document.documentElement.setAttribute('data-theme', t);
    var b = $('themeBtn'); if (b) b.title = t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
  }

  function applySettings() {
    var root = document.documentElement.style;
    root.setProperty('--read-font', FONTS[state.font] || FONTS.serif);
    root.setProperty('--read-size', state.size + 'px');
    root.setProperty('--measure', state.width + 'ch');
    document.querySelectorAll('[data-font]').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.font === state.font); });
    document.querySelectorAll('[data-width]').forEach(function (b) { b.setAttribute('aria-pressed', +b.dataset.width === state.width); });
    // mono is already wide per character; keep the column from getting too long
    if (state.font === 'mono') root.setProperty('--measure', Math.round(state.width * 1.05) + 'ch');
  }

  function escapeHtml(s) { return s.replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function render() {
    var has = !!state.text;
    $('empty').classList.toggle('hidden', has);
    $('doc').classList.toggle('hidden', !has);
    $('clearBtn').disabled = !has;
    $('filenameText').textContent = state.name || '';
    $('filename').title = state.name || '';
    $('filename').classList.toggle('hidden', !has);
    document.title = state.name ? state.name + ' — Markdown Reader' : 'Markdown Reader';
    if (!has) { $('doc').innerHTML = ''; return; }

    var src = state.text.replace(/^﻿/, '');
    var front = '';
    var m = /^---\r?\n([\s\S]*?)\r?\n---\r?\n?/.exec(src);
    if (m) { front = '<div class="frontmatter">' + escapeHtml(m[1]) + '</div>'; src = src.slice(m[0].length); }

    var html = (window.marked ? marked.parse(src, { gfm: true, breaks: false }) : '<pre>' + escapeHtml(src) + '</pre>');
    if (window.DOMPurify) html = DOMPurify.sanitize(html);
    $('doc').innerHTML = front + html;
    $('doc').querySelectorAll('a[href^="http"]').forEach(function (a) { a.target = '_blank'; a.rel = 'noopener'; });
    window.scrollTo(0, 0);
  }

  function setDoc(text, name, kind) {
    state.text = text || ''; state.name = name || '';
    if (!state.text) state.currentId = null;
    else if (kind) state.currentId = addToHistory(state.text, state.name, kind);
    try { save(); } catch (e) {}
    render(); renderHistory();
  }
  function readFile(file) {
    if (!file) return;
    var r = new FileReader();
    r.onload = function () { setDoc(String(r.result), file.name, 'file'); };
    r.readAsText(file);
  }

  function init() {
    load(); loadHistory(); applyTheme(); applySettings(); render(); renderHistory();
    // keep the sidebar below the (wrapping) header
    var setBarH = function () { document.documentElement.style.setProperty('--bar-h', $('bar').offsetHeight + 'px'); };
    setBarH(); if (window.ResizeObserver) new ResizeObserver(setBarH).observe($('bar'));
    setSide(state.side == null ? window.innerWidth >= 1000 : !!state.side);
    $('sideBtn').addEventListener('click', function () { setSide(!document.body.classList.contains('side-open')); });
    $('histClear').addEventListener('click', function () {
      if (!history.length || !confirm('Clear all history? Documents are only stored in this browser.')) return;
      history = []; saveHistory(); renderHistory();
    });
    setInterval(renderHistory, 60000);
    // on narrow screens the sidebar overlays the page; tap outside to close it
    document.addEventListener('click', function (e) {
      if (window.innerWidth < 1000 && document.body.classList.contains('side-open') && !e.target.closest('#side') && !e.target.closest('#sideBtn')) setSide(false);
    });
    $('themeBtn').addEventListener('click', function () {
      state.theme = currentTheme() === 'dark' ? 'light' : 'dark'; applyTheme(); save();
    });
    if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { if (!state.theme) applyTheme(); });

    document.querySelectorAll('[data-font]').forEach(function (b) {
      b.addEventListener('click', function () { state.font = b.dataset.font; applySettings(); save(); });
    });
    document.querySelectorAll('[data-width]').forEach(function (b) {
      b.addEventListener('click', function () { state.width = +b.dataset.width; applySettings(); save(); });
    });
    document.querySelectorAll('[data-size]').forEach(function (b) {
      b.addEventListener('click', function () {
        var i = SIZES.indexOf(state.size); if (i < 0) i = 4;
        i = Math.max(0, Math.min(SIZES.length - 1, i + (+b.dataset.size)));
        state.size = SIZES[i]; applySettings(); save();
      });
    });

    [$('openBtn'), $('openBtn2')].forEach(function (b) { b.addEventListener('click', function () { $('fileInput').click(); }); });
    $('fileInput').addEventListener('change', function (e) { readFile(e.target.files[0]); e.target.value = ''; });
    $('clearBtn').addEventListener('click', function () { setDoc('', ''); });

    // keyboard shortcuts: Cmd/Ctrl+O open, Cmd/Ctrl+Backspace clear
    var isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
    var mod = isMac ? '⌘' : 'Ctrl+';
    document.querySelectorAll('kbd.sc').forEach(function (k) { k.textContent = mod + (k.dataset.keys === '⌫' && !isMac ? 'Backspace' : k.dataset.keys); });
    $('openBtn').title = 'Open a Markdown file (' + mod + 'O)';
    $('clearBtn').title = 'Clear the current document (' + mod + (isMac ? '⌫' : 'Backspace') + ')';
    document.addEventListener('keydown', function (e) {
      if (!(e.metaKey || e.ctrlKey) || e.altKey || e.shiftKey) return;
      var k = e.key.toLowerCase();
      if (k === 'o') { e.preventDefault(); $('fileInput').click(); }
      else if ((k === 'backspace' || k === 'delete') && state.text) { e.preventDefault(); setDoc('', ''); }
    });

    // paste anywhere
    document.addEventListener('paste', function (e) {
      var cd = e.clipboardData; if (!cd) return;
      if (cd.files && cd.files[0]) { e.preventDefault(); readFile(cd.files[0]); return; }
      var t = cd.getData('text/plain');
      if (t && t.trim()) { e.preventDefault(); setDoc(t, titleFromText(t), 'paste'); }
    });

    // drop anywhere
    var depth = 0;
    document.addEventListener('dragenter', function (e) { e.preventDefault(); depth++; document.body.classList.add('dragging'); });
    document.addEventListener('dragleave', function () { depth = Math.max(0, depth - 1); if (!depth) document.body.classList.remove('dragging'); });
    document.addEventListener('dragover', function (e) { e.preventDefault(); });
    document.addEventListener('drop', function (e) {
      e.preventDefault(); depth = 0; document.body.classList.remove('dragging');
      var f = e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) readFile(f);
      else { var t = e.dataTransfer.getData('text/plain'); if (t) setDoc(t, titleFromText(t), 'paste'); }
    });

    window.addEventListener('scroll', function () { $('bar').classList.toggle('scrolled', window.scrollY > 4); }, { passive: true });
  }
  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
